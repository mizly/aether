# Public release announcement -> #releases (DISCORD_WEBHOOK_URL_2).
# Jar download only: no source archive, no checksums.
#
# Required repo secret: DISCORD_WEBHOOK_URL_2   (skipped when empty)
#
# Same GITHUB_TOKEN caveat as discord-beta.yml: a release created with the
# default token does not fire `release: published`, so either give build.yml's
# "Create Release" step a PAT or run this manually with the release tag.
name: Discord Public Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to announce"
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Release Tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 1

      - name: Resolve Release Metadata
        id: release
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json name,tagName,url,assets > release.json

          JAR_NAME=$(jq -r '[.assets[].name | select(endswith(".jar"))
            | select(contains("sources") | not)
            | select(contains("-dev") | not)] | first // empty' release.json)

          if [ -z "$JAR_NAME" ]; then
            echo "No release jar asset found on $RELEASE_TAG" >&2
            exit 1
          fi

          {
            echo "name=$(jq -r '.name // .tagName' release.json)"
            echo "url=$(jq -r '.url' release.json)"
            echo "jar_name=$JAR_NAME"
            echo "jar_url=https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/$JAR_NAME"
          } >> "$GITHUB_OUTPUT"

          {
            echo 'commit_message<<AETHER_EOF'
            git log -1 --pretty=%B
            echo AETHER_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Send Discord Webhook
        env:
          DISCORD_WEBHOOK_URL_2: ${{ secrets.DISCORD_WEBHOOK_URL_2 }}
          COMMIT_MESSAGE: ${{ steps.release.outputs.commit_message }}
        run: |
          set -euo pipefail
          if [ -z "$DISCORD_WEBHOOK_URL_2" ]; then
            echo "Skipping public notify: DISCORD_WEBHOOK_URL_2 is not set"
            exit 0
          fi

          printf -v DESCRIPTION "A new build has been released! :rocket:\n\n**Commit Message:**\n%s" "$COMMIT_MESSAGE"

          jq -n \
            --arg title "New Release: ${{ steps.release.outputs.name }}" \
            --arg desc "$DESCRIPTION" \
            --arg url "${{ steps.release.outputs.url }}" \
            --arg jar_name "${{ steps.release.outputs.jar_name }}" \
            --arg jar_url "${{ steps.release.outputs.jar_url }}" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                url: $url,
                color: 5814783,
                fields: [
                  {
                    name: "Release Page",
                    value: "[View Release](\($url))",
                    inline: true
                  },
                  {
                    name: "Download JAR",
                    value: "[\($jar_name)](\($jar_url))",
                    inline: true
                  }
                ]
              }]
            }' > payload.json

          curl -sS -f -H "Content-Type: application/json" -d @payload.json "$DISCORD_WEBHOOK_URL_2"
