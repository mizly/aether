name: Build and Release

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "translations/**"
  push:
    branches:
      - master
      - main
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "translations/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve Commit Message
        id: commit
        run: |
          {
            echo 'message<<EOF'
            git log -1 --pretty=%B
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Resolve Release Version
        id: vars
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('gradle.properties', 'utf8');
            const match = content.match(/^aether_version\s*=\s*(.+)\s*$/m);
            if (!match) {
              core.setFailed('aether_version was not found in gradle.properties');
              return;
            }

            const baseVersion = match[1].trim().replace(/^[vV]/, '');
            const prefix = `${baseVersion}-r`;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            let maxRevision = 0;
            for (const release of releases) {
              const tag = (release.tag_name || '').trim().replace(/^[vV]/, '');
              if (!tag.startsWith(prefix)) continue;

              const revision = Number.parseInt(tag.slice(prefix.length), 10);
              if (Number.isInteger(revision) && revision > maxRevision) {
                maxRevision = revision;
              }
            }

            const releaseVersion = `${baseVersion}-r${maxRevision + 1}`;
            core.setOutput('base_version', baseVersion);
            core.setOutput('release_version', releaseVersion);
            core.setOutput('release_tag', releaseVersion);

      - name: Build with Gradle
        run: ./gradlew build --no-daemon -Paether_version=${{ steps.vars.outputs.release_version }} -Paether_file_suffix=${{ endsWith(github.repository, '/aether-ea') && '-beta' || '' }}

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aether-${{ steps.vars.outputs.release_version }}
          path: build/libs/*.jar

      - name: Create Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.release_tag }}
          name: ${{ steps.vars.outputs.release_version }}
          body: |
            Automated build version: ${{ steps.vars.outputs.release_version }}

            Base version: ${{ steps.vars.outputs.base_version }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Message: ${{ steps.commit.outputs.message }}
          files: build/libs/*.jar
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Source Archive
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ steps.vars.outputs.release_version }}"
          git archive --format=zip -9 --prefix="aether-$VERSION-src/" -o "build/aether-$VERSION-src.zip" HEAD

      - name: Send Discord Webhook
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_MESSAGE: ${{ steps.commit.outputs.message }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Skipping Discord Webhook: DISCORD_WEBHOOK_URL secret is not set"
            exit 0
          fi

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${{ steps.vars.outputs.release_tag }}"
          VERSION="${{ steps.vars.outputs.release_version }}"
          JAR_PATH="$(ls build/libs/*.jar | grep -v 'sources' | grep -v 'dev' | head -n 1)"
          JAR_FILE="$(basename "$JAR_PATH")"
          JAR_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.release_tag }}/$JAR_FILE"
          SRC_PATH="build/aether-$VERSION-src.zip"

          printf -v DESC_VAR "A new build has been released! :rocket:\n\n**Commit Message:**\n%s" "$COMMIT_MESSAGE"

          # a private repo's release links 404 for anyone outside it, so the files go to discord instead
          if [ "$REPO_PRIVATE" = "true" ]; then
            jq -n \
              --arg title "New Release: $VERSION Automated Build" \
              --arg desc "$DESC_VAR" \
              '{
                embeds: [{
                  title: $title,
                  description: $desc,
                  color: 5814783,
                  footer: { text: "The mod jar and the source are attached below" }
                }],
                attachments: [{ id: 0 }]
              }' > payload.json
            # one file per message keeps each request under discord's default 10mb webhook upload limit
            send_file() {
              local payload="$1" file="$2" type="$3"
              if [ "$(stat -c %s "$file")" -gt 10485760 ]; then
                jq --arg content "$(basename "$file") is over Discord's 10MB upload limit, grab it from the release" \
                  'del(.attachments) + { content: $content }' "$payload" > oversize.json
                curl --fail-with-body -sS -H "Content-Type: application/json" -d @oversize.json "$DISCORD_WEBHOOK_URL"
                return
              fi
              curl --fail-with-body -sS \
                -F "payload_json=<$payload;type=application/json" \
                -F "files[0]=@$file;type=$type" \
                "$DISCORD_WEBHOOK_URL"
            }
            send_file payload.json "$JAR_PATH" application/java-archive
            jq -n --arg content "Source for $VERSION" '{ content: $content, attachments: [{ id: 0 }] }' > source.json
            send_file source.json "$SRC_PATH" application/zip
            exit 0
          fi

          jq -n \
            --arg title "New Release: $VERSION Automated Build" \
            --arg desc "$DESC_VAR" \
            --arg url "$RELEASE_URL" \
            --arg rel_url "$RELEASE_URL" \
            --arg jar_file "$JAR_FILE" \
            --arg jar_url "$JAR_URL" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                url: $url,
                color: 5814783,
                fields: [
                  {
                    name: "Release Page",
                    value: "[View Release](\($rel_url))",
                    inline: true
                  },
                  {
                    name: "Download JAR",
                    value: "[Download \($jar_file)](\($jar_url))",
                    inline: true
                  }
                ]
              }]
            }' > payload.json

          curl --fail-with-body -sS -H "Content-Type: application/json" -d @payload.json "$DISCORD_WEBHOOK_URL"
